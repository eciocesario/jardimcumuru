# Configuração de publicação (Netlify) — Pousada Jardim Cumuru
# Arraste a pasta "publish" em app.netlify.com/drop; este arquivo é lido automaticamente.

# Cabeçalhos de segurança e cache
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache longo para imagens e assets estáticos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redireciona /en para /en/ (barra final) para o hreflang ficar consistente
[[redirects]]
  from = "/en"
  to = "/en/"
  status = 301

# O arquivo de prévia não precisa ser indexado pelo Google
[[headers]]
  for = "/jardim-cumuru-preview.html"
  [headers.values]
    X-Robots-Tag = "noindex"
